# Tariff zones for the energy report (Mission Control). Local hours, interval [from, to), format HH:MM-HH:MM.
# Price in PLN per kWh (gross, with variable fees) — empty (null) = the report will show only the kWh in the zone, no cost.
# Default G12: cheaper zone 22:00-06:00 and 13:00-15:00, the rest of the day is more expensive. Check the hours in your contract.
nazwa: G12
strefy:
  - nazwa: nocna (tańsza)
    godziny: ["22:00-06:00", "13:00-15:00"]
    cena: null
  - nazwa: dzienna (droższa)
    godziny: reszta
    cena: null
# G12w: weekends whole day in the cheaper zone — enter the zone name here, e.g. "nocna (tańsza)"; null = as on weekdays
weekend_cala_doba: null
